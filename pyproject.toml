[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────────────────────
# SINGLE SOURCE OF TRUTH for the distribution name, the import name and the
# version. Changing the three values below plus the two matching lines in
# README.md / README.tr.md is the whole rename: nothing else hard-codes them
# (`Configuration.user_agent` reads the installed metadata at runtime).
#
#   distribution name : lunixi-sdk      → `pip install lunixi-sdk`
#   import name       : lunixi          → `from lunixi import LunixiClient`
#   version           : 0.2.0           → payment + fraud source release
#   minimum Python    : 3.9
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "lunixi-sdk"
version = "0.2.0"
description = "Lunixi payment and fraud SDK with Ed25519 authentication, verified webhooks and durable native checkout orchestration."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lunixi" }]
keywords = ["lunixi", "payments", "fraud", "ed25519", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Ed25519 signing is delegated to `cryptography`, the standard primitive
# provider for Python packages. Hand-written curve arithmetic has no place in a
# customer SDK: a signing bug is silent and every request fails authentication.
dependencies = ["cryptography>=50.0.2,<51", "rfc8785>=0.1.4,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff==0.17.3", "mypy==2.4.1; python_version >= '3.10'", "build==1.6.1; python_version >= '3.10'", "bandit==1.9.4; python_version >= '3.10'", "pip-audit==2.10.1; python_version >= '3.10'"]
frameworks = ["Django==6.1.2; python_version >= '3.12'", "fastapi==0.162.0; python_version >= '3.10'", "Flask==3.1.3", "uvicorn==0.54.0; python_version >= '3.10'", "itsdangerous==2.2.0", "pytest-django==4.14.0; python_version >= '3.12'", "httpx2==2.16.0; python_version >= '3.12'"]

[project.urls]
Homepage = "https://lunixi.com"
Documentation = "https://docs.lunixi.com/sdks/python"
Source = "https://github.com/Lunixi-Payment/lunixi-python"
Changelog = "https://github.com/Lunixi-Payment/lunixi-python/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lunixi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
